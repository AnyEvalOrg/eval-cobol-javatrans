[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-cobol-javatrans"
version = "1.0.0"
description = "COBOL-JavaTrans bidirectional translation, packaged offline for AnyEval and Inspect"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
# AnyEval requirements give ranges; these are its installed, resolved versions.
inspect = ["inspect_ai==0.3.260"]
anyeval = ["inspect_ai==0.3.260", "inspect-evals==0.19.0", "inspect-k8s-sandbox==0.13.0"]
test = ["inspect_ai==0.3.260", "pytest>=8", "PyYAML>=6", "jsonschema>=4"]

# Inspect discovers this import before resolving either cobol_javatrans task.
[project.entry-points.inspect_ai]
cobol_javatrans = "cobol_javatrans"

[tool.setuptools]
packages = ["cobol_javatrans"]
include-package-data = true
license-files = ["LICENSE", "UPSTREAM-LICENSE", "NOTICE.md"]

[tool.setuptools.package-data]
cobol_javatrans = ["data/*.gz", "data/*.json", "*.yaml", "Dockerfile", "chart/*.yaml", "chart/templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --basetemp=.build/pytest-tmp"
