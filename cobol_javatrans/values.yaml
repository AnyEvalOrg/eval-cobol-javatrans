# AnyEval chart default values; provider chart is an explicit exception.
# AnyEval: set INSPECT_K8S_DEFAULT_NAMESPACE=anyeval-sandbox.
global:
  nameOverride: ""
  fullnameOverride: ""
automountServiceAccountToken: false
serviceAccountCreate: false
allowDomains: []
allowEntities: []
allowCIDR: []
services:
  default:
    # Cloud Build tag matches pyproject.toml; AnyEval pins the digest in its catalog.
    image: us-central1-docker.pkg.dev/openevalz-sbx-84737/openevalz/eval-cobol-sandbox:1.0.0
    command: ["sleep", "infinity"]
    workingDir: /tmp
    runtimeClassName: gvisor
    nodeSelector:
      cloud.google.com/gke-spot: "true"
    networkIsolated: true
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
        add: ["SETUID", "SETGID", "KILL", "CHOWN", "DAC_OVERRIDE"]
      seccompProfile:
        type: RuntimeDefault
    # Equal CPU/memory requests and limits give Guaranteed QoS and reserve the
    # full 2 GiB, avoiding memory overcommit onto the supervisor's node budget.
    # Aggregate UID RSS watchdog: 768 MiB + at most one 50 ms allocation burst
    # + file cache, /dev/shm and supervisor headroom within 2 GiB.
    # Native AS/DATA: 1 GiB/process. JVM heap/metaspace/code: 512/256/64 MiB
    # (8 GiB virtual AS/DATA); all resident candidate memory is watched.
    # gVisor records oom_score_adj but does not use it: it is NOT containment.
    # Read-only root; /tmp is DISK-backed emptyDir, sizeLimit 512 MiB is an
    # eviction backstop, not a synchronous write limit. Pod ephemeral-storage:
    # 1 GiB. The supervisor watches all regular-file allocated blocks under
    # /tmp and /dev/shm: 256 MiB + one 100 ms write burst. gVisor gofer write
    # throughput makes the burst small. Do not rely on tmpfs sizeLimit under
    # gVisor: Memory emptyDir limits are not enforced as tmpfs mount sizes.
    # /dev/shm remains Memory emptyDir with sizeLimit 16 MiB; the disk watchdog
    # includes it. /tmp holds work, compiler scratch, requests and captured streams.
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 1Gi
# Standard NetworkPolicy is visible to AnyEval's provenance hook (which queries
# networking.k8s.io). The Autopilot cluster has no CiliumNetworkPolicy CRD;
# the custom AnyEval chart emits only this standard policy, including DNS denial.
additionalResources:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: '{{ .Release.Name }}-cobol-javatrans-deny-all'
      namespace: '{{ .Release.Namespace }}'
    spec:
      # Select THIS release's pod only. `podSelector: {}` selects every pod in the namespace,
      # including shared infrastructure such as the egress proxy, and starved it of egress.
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: '{{ .Release.Name }}'
      policyTypes: [Ingress, Egress]
      ingress: []
      egress: []
