# AnyEval chart default values; provider chart is an explicit exception.
# AnyEval: set INSPECT_K8S_DEFAULT_NAMESPACE=anyeval-sandbox.
global:
  nameOverride: ""
  fullnameOverride: ""
automountServiceAccountToken: false
serviceAccountCreate: false
allowDomains: []
allowEntities: []
allowCIDR: []
services:
  default:
    # Cloud Build tag matches pyproject.toml; AnyEval pins the digest in its catalog.
    image: us-central1-docker.pkg.dev/openevalz-sbx-84737/openevalz/eval-cobol-sandbox:1.0.0
    command: ["sleep", "infinity"]
    workingDir: /tmp
    runtimeClassName: gvisor
    nodeSelector:
      cloud.google.com/gke-spot: "true"
    networkIsolated: true
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
        add: ["SETUID", "SETGID", "KILL", "CHOWN", "DAC_OVERRIDE", "SYS_PTRACE"]
      seccompProfile:
        type: RuntimeDefault
    # Equal CPU/memory requests and limits give Guaranteed QoS and reserve the
    # full 2 GiB, avoiding memory overcommit onto the supervisor's node budget.
    # Aggregate UID RSS watchdog: 768 MiB + at most one 50 ms allocation burst
    # + file cache, descriptor-retained bytes and supervisor headroom within 2 GiB.
    # Native AS/DATA: 1 GiB/process. JVM heap/metaspace/code: 512/256/64 MiB
    # (8 GiB virtual AS/DATA); all resident candidate memory is watched.
    # gVisor records oom_score_adj but does not use it: it is NOT containment.
    # Read-only root and /dev/shm: zero candidate-writable memory-backed mount
    # capacity. /tmp is disk-backed; 512 MiB sizeLimit is an eviction backstop.
    # Watchdog: 256 MiB directory-visible + descriptor-retained allocated bytes
    # (including unlinked files/memfds), de-duplicated by device/inode, plus one
    # scan + 100 ms write burst. More than 10,000 directory entries also trips it.
    # Native/Java NOFILE: 256/1024 per process; at most 64 candidate processes.
    # 768 MiB RSS + 256 MiB file budget = 1 GiB before bursts/cache/supervisor,
    # leaving 1 GiB of the 2 GiB container budget as headroom. This is sampled
    # enforcement, not a synchronous quota. Memory emptyDir sizeLimit alone
    # is not a gVisor tmpfs limit; readOnly is the /dev/shm boundary.
    volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
    volumeMounts:
      - name: tmp
        mountPath: /tmp
      - name: shm
        mountPath: /dev/shm
        readOnly: true
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 1Gi
# Standard NetworkPolicy is visible to AnyEval's provenance hook (which queries
# networking.k8s.io). The Autopilot cluster has no CiliumNetworkPolicy CRD;
# the custom AnyEval chart emits only this standard policy, including DNS denial.
additionalResources:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: '{{ .Release.Name }}-cobol-javatrans-deny-all'
      namespace: '{{ .Release.Namespace }}'
    spec:
      # Select THIS release's pod only. `podSelector: {}` selects every pod in the namespace,
      # including shared infrastructure such as the egress proxy, and starved it of egress.
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: '{{ .Release.Name }}'
      policyTypes: [Ingress, Egress]
      ingress: []
      egress: []
